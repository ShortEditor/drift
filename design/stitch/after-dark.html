<!-- Google Fonts: Syne & Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&amp;family=Syne:wght@700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->

<!-- BEGIN: Custom Styles -->
<style data-purpose="base-layout">
    body {
      background-color: #08080A;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Subtle Glassmorphism Utility */
    .glass-pill {
      background: rgba(18, 19, 26, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }
    
    .glass-btn {
      background: rgba(18, 19, 26, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.5);
    }

    /* Ambient Glow on Neon Elements */
    .lime-glow {
      box-shadow: 0 0 16px rgba(212, 255, 0, 0.45);
    }

    .lime-glow-subtle {
      box-shadow: 0 0 8px rgba(212, 255, 0, 0.35);
    }
  </style>
<style data-purpose="waveform-animation">
    /* Animated Waveform Equalizer Ticks */
    @keyframes bounceWave {
      0%, 100% { height: 4px; }
      50% { height: 16px; }
    }
    .wave-bar-1 { animation: bounceWave 1.1s ease-in-out infinite; }
    .wave-bar-2 { animation: bounceWave 0.8s ease-in-out infinite 0.2s; }
    .wave-bar-3 { animation: bounceWave 1.4s ease-in-out infinite 0.1s; }
    .wave-bar-4 { animation: bounceWave 0.9s ease-in-out infinite 0.35s; }
  </style>
<!-- END: Custom Styles -->
</head>
